name: Temporary Warning Letter Generator Preview

on:
  push:
    branches:
      - feature/warning-letter-settings
    paths:
      - warning-letter-generator.html
      - .github/workflows/warning-letter-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: warning-letter-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Prepare isolated static preview
        run: |
          mkdir -p site
          cp warning-letter-generator.html site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy temporary preview
        id: deployment
        uses: actions/deploy-pages@v4
